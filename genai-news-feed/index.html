<html>

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0" />
        <title>Generative News Feed</title>
        <meta name="description" content="Crio Feed Website" />
        <link rel="stylesheet" href="resources/css/index.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
                integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
                crossorigin="anonymous">

</head>

<body>
        <!--Header-->
        <div class="header">
                <nav class="navbar navbar-light">
                        <div class=" container">
                        <div class="navbar-brand-icon"></div>
                        <a class="navbar-brand" href="#">
                                <h3>Generative News Feed</h3>
                        </a>
        </div>
        </nav>
        </div>
        <!--Divider-->
        <div class="feed-divider"></div>

        <!--News Feed-->
        <div class="feed-container">
                <div class="latest">
                        <h4>Today</h4>
                        <p>The insights you need to keep ahead</p>
                </div>
                <div class="feed-body">
                        <div class="accordion" id="accordionExample">
                                <div class="accordion-item" id = "tech-accordion-item">
                                        <h2 class="accordion-header">
                                                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                                        data-bs-target="#collapseOne" aria-expanded="true"
                                                        aria-controls="collapseOne">
                                                        Technology
                                                </button>
                                        </h2>
                                        <div id="collapseOne" class="accordion-collapse collapse show"
                                                data-bs-parent="#accordionExample">
                                                <div class="accordion-body">
                                                        <div id="carouselExample" class="carousel slides">
                                                                <div class="carousel-inner " id="tech-carousel-news">

                                                                </div>
                                                                <!-- Carousel Navigation Buttons Commom for very news feed-->
                                                                <button class="nav-button-prev carousel-control-prev"
                                                                        type="button" data-bs-target="#carouselExample"
                                                                        data-bs-slide="prev">
                                                                        <span class="carousel-control-prev-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Previous</span>
                                                                </button>
                                                                <button class=" nav-button-next carousel-control-next"
                                                                        type="button" data-bs-target="#carouselExample"
                                                                        data-bs-slide="next">
                                                                        <span class="carousel-control-next-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Next</span>
                                                                </button>
                                                        </div>

                                                </div>
                                        </div>
                                </div>
                                <div class="accordion-item" id = "politics-accordion-item">
                                        <h2 class="accordion-header">
                                                <button class="accordion-button collapsed" type="button"
                                                        data-bs-toggle="collapse" data-bs-target="#collapseTwo"
                                                        aria-expanded="false" aria-controls="collapseTwo">
                                                        Politics
                                                </button>
                                        </h2>
                                        <div id="collapseTwo" class="accordion-collapse collapse"
                                                data-bs-parent="#accordionExample">
                                                <div class="accordion-body">
                                                        <div id="carousel-politics" class="carousel slide">
                                                                <div class="carousel-inner "
                                                                        id="politics-carousel-news">

                                                                </div>
                                                                <button class="nav-button-prev carousel-control-prev"
                                                                        type="button"
                                                                        data-bs-target="#carousel-politics"
                                                                        data-bs-slide="prev">
                                                                        <span class="carousel-control-prev-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Previous</span>
                                                                </button>
                                                                <button class=" nav-button-next carousel-control-next"
                                                                        type="button"
                                                                        data-bs-target="#carousel-politics"
                                                                        data-bs-slide="next">
                                                                        <span class="carousel-control-next-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Next</span>
                                                                </button>
                                                        </div>

                                                </div>
                                        </div>
                                </div>
                                <div class="accordion-item" id  = "sports-accordion-item">
                                        <h2 class="accordion-header">       
                                                <button class="accordion-button collapsed" type="button"
                                                        data-bs-toggle="collapse" data-bs-target="#collapseThree"
                                                        aria-expanded="false" aria-controls="collapseThree">
                                                        Sports
                                                </button>


                                        </h2>
                                        <div id="collapseThree" class="accordion-collapse collapse"
                                                data-bs-parent="#accordionExample">
                                                <div class="accordion-body">
                                                        <div id="carousel-sports" class="carousel slide">
                                                                <div class="carousel-inner " id="sports-carousel-news">

                                                                </div>
                                                                <button class="nav-button-prev carousel-control-prev"
                                                                        type="button" data-bs-target="#carousel-sports"
                                                                        data-bs-slide="prev">
                                                                        <span class="carousel-control-prev-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Previous</span>
                                                                </button>
                                                                <button class=" nav-button-next carousel-control-next"
                                                                        type="button"
                                                                        data-bs-target="#carousel-eoconomy"
                                                                        data-bs-slide="next">
                                                                        <span class="carousel-control-next-icon"
                                                                                aria-hidden="true"></span>
                                                                        <span class="visually-hidden">Next</span>
                                                                </button>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                        </div>



                        <div class="featured">

                                <section class="technology">
                                        <h2 class="accordion-header">
                                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                                data-bs-target="#collapsetechnology" aria-expanded="false"
                                                aria-controls="collapsetechnology"><i id="technologyArrow"></i>
                                                <h5>Technology</h5>
                                        </button>
                                </h2>
                                        <!--Place hodler for drop down -->

                                        <div class="collapse technology-body" id="collapsetechnology">
                                                <div id="carouselExample" class="carousel slides">
                                                        <div class="carousel-inner " id="tech-carousel-news">

                                                        </div>
                                                        <button class="nav-button-prev carousel-control-prev"
                                                                type="button" data-bs-target="#carouselExample"
                                                                data-bs-slide="prev">
                                                                <span class="carousel-control-prev-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Previous</span>
                                                        </button>
                                                        <button class=" nav-button-next carousel-control-next"
                                                                type="button" data-bs-target="#carouselExample"
                                                                data-bs-slide="next">
                                                                <span class="carousel-control-next-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Next</span>
                                                        </button>
                                                </div>
                                        </div>
                                </section>
                                <section class="politics">
                                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                                data-bs-target="#collapsePolitics" aria-expanded="false"
                                                aria-controls="collapsePolitics"><i id="technologyArrow"></i>
                                                <h5>Politics</h5>
                                        </button>
                                        <!--Place hodler for drop down -->
                                        <div class="collapse politics-body" id="collapsePolitics">
                                                <div id="carousel-politics" class="carousel slide">
                                                        <div class="carousel-inner " id="politics-carousel-news">

                                                        </div>
                                                        <button class="nav-button-prev carousel-control-prev"
                                                                type="button" data-bs-target="#carousel-politics"
                                                                data-bs-slide="prev">
                                                                <span class="carousel-control-prev-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Previous</span>
                                                        </button>
                                                        <button class=" nav-button-next carousel-control-next"
                                                                type="button" data-bs-target="#carousel-politics"
                                                                data-bs-slide="next">
                                                                <span class="carousel-control-next-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Next</span>
                                                        </button>
                                                </div>
                                        </div>

                                </section>
                                <section class="sports">
                                        <h2>
                                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                                data-bs-target="#collapseSports" aria-expanded="false"
                                                aria-controls="collapseEconomy"><i id="technologyArrow"></i>
                                                <h5>Sports</h5>
                                        </button> 
                                </h2>      
                                        <!--Place hodler for drop down -->
                                        <div class="collapse sports-body" id="collapseSports">
                                                <div id="carousel-sports" class="carousel slide">
                                                        <div class="carousel-inner " id="sports-carousel-news">

                                                        </div>
                                                        <button class="nav-button-prev carousel-control-prev"
                                                                type="button" data-bs-target="#carousel-sports"
                                                                data-bs-slide="prev">
                                                                <span class="carousel-control-prev-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Previous</span>
                                                        </button>
                                                        <button class=" nav-button-next carousel-control-next"
                                                                type="button" data-bs-target="#carousel-eoconomy"
                                                                data-bs-slide="next">
                                                                <span class="carousel-control-next-icon"
                                                                        aria-hidden="true"></span>
                                                                <span class="visually-hidden">Next</span>
                                                        </button>
                                                </div>
                                        </div>

                                </section>
                        </div>

                </div>

        </div>



        <script src="resources/data/magazines.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                crossorigin="anonymous"></script>
        <script type="module">
                import { fetchData, updateTechnologyDOM, updateSportsDOM, updatePoliticsDOM } from "../resources/js/index.js";
                let tech_data;
                let sports_data;
                let politics_data;
                (async function () {
                        try {

                                //fetch tech news
                                let URL = "https://api.rss2json.com/v1/api.json?rss_url=https://flipboard.com/@dfletcher/india-tech-b2meqpd6z.rss";
                                tech_data = await fetchData(URL);
                                console.log(tech_data, "tech_data")

                                //fetch sports news
                                URL = "https://api.rss2json.com/v1/api.json?rss_url=https://flipboard.com/@thehindu/sportstarlive-rj3ttinvz.rss";
                                sports_data = await fetchData(URL);
                                console.log(sports_data, "sports_data")

                                //fetch  economy news
                                URL = "https://api.rss2json.com/v1/api.json?rss_url=https://flipboard.com/@thenewsdesk/the-latest-on-coronavirus-covid-19-t82no8kmz.rss";
                                politics_data = await fetchData(URL);
                                console.log(politics_data, "politics_data")
                        }
                        catch (error) {
                                console.error("Error:", error);

                        }
                        updateTechnologyDOM(tech_data);
                        updateSportsDOM(sports_data);
                        updatePoliticsDOM(politics_data);
                })();     
        </script>

</body>

</html>
